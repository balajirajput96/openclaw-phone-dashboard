name: Hourly Health Check

on:
  schedule:
    # Run at minute 17 to avoid the highest-volume top-of-hour queue.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openclaw-hourly-health
  cancel-in-progress: false

jobs:
  validate:
    # Keep the validation cycle bounded to the requested 2,400 workflow runs.
    # Manual dispatches count as runs too; after the limit, scheduled jobs no-op.
    if: ${{ github.run_number <= 2400 }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type checks
        run: pnpm check

      - name: Run unit tests
        run: pnpm test

      - name: Build production bundle
        run: pnpm build
